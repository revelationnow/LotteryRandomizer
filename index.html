<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the layout can pad itself around notches and the
         home indicator. Zoom is deliberately left enabled. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05060f" />
    <meta name="color-scheme" content="dark" />
    <title>Orrery — history-weighted lottery numbers</title>
    <meta
      name="description"
      content="Generate Powerball and Mega Millions numbers weighted by real draw history — and see the statistics that prove it is all chance."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Start the data request before the bundle parses.

      The app used to fetch inside a useEffect, so the request could not begin
      until React had mounted — on a slow phone that serialised roughly a second
      of script evaluation ahead of a request that itself takes milliseconds.
      Kicking it off here overlaps the two.

      Paths are relative on purpose: they resolve against the deployment root on
      both a domain root and a GitHub Pages subpath, and hash routing means the
      document URL is always that root. The standalone build strips this block,
      since it carries its data inline.
    -->
    <script id="orrery-prefetch">
      (function () {
        var get = function (path) {
          return fetch(new URL(path, document.baseURI))
            .then(function (r) {
              return r.ok ? r.json() : null;
            })
            .catch(function () {
              return null;
            });
        };
        window.__ORRERY_PREFETCH__ = {
          manifest: get('data/manifest.json'),
          powerball: get('data/powerball.json'),
          megamillions: get('data/megamillions.json'),
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
