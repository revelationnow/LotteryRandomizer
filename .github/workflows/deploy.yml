name: Build and deploy

on:
  # Deploy whatever the repository's default branch happens to be, rather than
  # hardcoding a name — this repo's default is not `main`, and pinning to a branch
  # that does not exist means the workflow silently never runs.
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pushes to feature branches skip straight past; only the default branch ships.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # A GitHub Pages project site lives under /<repo>/, unlike Cloudflare Pages
      # which serves from the root.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # One-time manual step before this can succeed: Settings -> Pages -> Source
      # -> "GitHub Actions". The default GITHUB_TOKEN can deploy to Pages but is
      # not allowed to create the Pages site (`enablement: true` fails with
      # "Resource not accessible by integration"), so this cannot be automated
      # without a PAT.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
