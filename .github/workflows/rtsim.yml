name: rtsim checks

# Typecheck, test and build the hardware scoping simulator whenever it changes.
on:
  push:
    paths: ['rtsim/**', '.github/workflows/rtsim.yml']
  pull_request:
    paths: ['rtsim/**', '.github/workflows/rtsim.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rtsim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rtsim/package-lock.json
      - run: npm ci
      - run: npm run ci
